function parseCSV(text) {
  const rows = []; let row = []; let cell = ''; let q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

  if (s === '' || s === '-') return null;
  const n = parseFloat(s);
  return isFinite(n) ? n : null;
}

function parseDate(v) {
  if (!v) return null;
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{2,4})/);
  if (m) { let y = +m[3]; if (y < 100) y += 2000; return new Date(y, +m[2] - 1, +m[1]); }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  m = s.match(/^Date\((\d+),(\d+),(\d+)/);
  if (m) return new Date(+m[1], +m[2], +m[3]);
  return null;
}

const low = s => String(s || '').trim().toLowerCase();

function netKey(s) {
  const t = low(s);
  if (/insta|инста/.test(t)) return 'instagram';
  if (/youtube|ютуб|you tube/.test(t)) return 'youtube';
  return null; // остальные соцсети не используем
}

function fmtName(s) {
  const t = low(s);
  if (/рилс|reel/.test(t)) return 'Рилс';
  if (/пост|post|карусел/.test(t)) return 'Посты';
  if (!t) return 'Другое';
  return String(s).trim().replace(/^./, c => c.toUpperCase());
}

function detectSheet(rows) {
  const head = rows.slice(0, 3).map(r => r.map(low).join('|')).join('|');
  if (/соцсеть/.test(head) && /охват/.test(head)) return 'content';
  if (/план/.test(head)) return 'goals';
  if (/недел/.test(head) || /показатель/.test(head)) return 'weekly';
  return null;
}

function normalizeContent(rows) {
  if (!rows || rows.length < 2) return [];
  const hi = rows.findIndex(r => r.some(c => low(c) === 'соцсеть'));
  if (hi < 0) return [];
  const H = rows[hi].map(low);
  const col = (...names) => H.findIndex(h => names.some(n => h.startsWith(n)));
  const ix = {
    date: col('дата'), net: col('соцсеть'), fmt: col('формат'), topic: col('тема'),
    reach: col('охват'), views: col('просмотр'), likes: col('лайк'), comments: col('коммент'),
    reposts: col('репост'), saves: col('сохран'), subs: col('подписк'), clicks: col('переход'),
  };
  const out = [];
  for (const r of rows.slice(hi + 1)) {
    const net = netKey(r[ix.net]);
    const date = parseDate(r[ix.date]);
    const reach = num(r[ix.reach]);
    if (!net || !date || !reach) continue; // пустые строки-заготовки пропускаем
    const g = k => (ix[k] >= 0 ? num(r[ix[k]]) || 0 : 0);
    out.push({
      date, net, fmt: fmtName(r[ix.fmt]), topic: String(r[ix.topic] || '').trim() || 'Без темы',
      reach, views: g('views') || reach, likes: g('likes'), comments: g('comments'),
      reposts: g('reposts'), saves: g('saves'), subs: g('subs'), clicks: g('clicks'),
    });
  }
  return out.sort((a, b) => a.date - b.date);
}

// «Еженедельная статистика»: блоки по соцсетям, строки-показатели, столбцы-недели
function normalizeWeekly(rows) {
  const res = {};
  if (!rows || !rows.length) return res;
  let cur = null;
  for (const r of rows) {
    const name = String(r[0] || '').trim();
    if (!name) continue;
    const vals = r.slice(1).map(num);
    const hasVals = vals.some(v => v !== null);
    const isHeader = name === name.toUpperCase() && /[A-ZА-ЯЁ]/.test(name) && !hasVals;
    if (isHeader) { cur = netKey(name); if (cur) res[cur] = res[cur] || {}; continue; }
    if (!cur) continue;
    const n = low(name);
    const key = /прирост/.test(n) ? 'gain' : /подписчик/.test(n) ? 'subs' : /охват/.test(n) ? 'reach'
      : /просмотр/.test(n) ? 'views' : /er|вовлеч/.test(n) ? 'er' : null;
    if (key) res[cur][key] = vals;
  }
  return res;
}

function normalizeGoals(rows) {
  const g = {};
  for (const r of rows || []) {
    if (/подписчик/.test(low(r[0]))) g.subs = { min: num(r[1]), max: num(r[2]), fact: num(r[3]) };
  }
  return g;
}

/* =====================  СОСТОЯНИЕ  ===================== */

const state = {
  net: 'instagram',
  period: 'month',
  content: normalizeContent(EMBED_CONTENT),
  weekly: normalizeWeekly(EMBED_WEEKLY),
  goals: normalizeGoals(EMBED_GOALS),
  updatedAt: null,
};

/* =====================  РАСЧЕТЫ  ===================== */

const DAY = 864e5;
const addDays = (d, n) => new Date(d.getTime() + n * DAY);
const startOfWeek = d => { const x = new Date(d); const wd = (x.getDay() + 6) % 7; x.setHours(0, 0, 0, 0); return addDays(x, -wd); };
const dm = d => String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0');
const dmy = d => dm(d) + '.' + d.getFullYear();
const fmtN = n => Math.round(n).toLocaleString('ru-RU');
const fmtK = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.', ',') + ' млн' : n >= 1e4 ? Math.round(n / 1e3) + ' тыс' : fmtN(n);
const fmtP = (n, d = 1) => n.toFixed(d).replace('.', ',') + '%';
const eng = p => p.likes + p.comments + p.saves;
const erOf = list => { const r = sum(list, 'reach'); return r ? sum(list, eng) / r * 100 : 0; };
function sum(list, f) { return list.reduce((s, p) => s + (typeof f === 'function' ? f(p) : p[f]), 0); }
function median(a) { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }

function periodRange(all) {
  const last = all[all.length - 1].date;
  const end = addDays(last, 1); // не включая
  if (state.period === 'week') return { from: addDays(end, -7), to: end, prevFrom: addDays(end, -14), prevTo: addDays(end, -7), label: 'прошлые 7 дней' };
  if (state.period === 'month') return { from: addDays(end, -30), to: end, prevFrom: addDays(end, -60), prevTo: addDays(end, -30), label: 'прошлые 30 дней' };
  return { from: all[0].date, to: end, prevFrom: null, prevTo: null, label: '' };
}
const inRange = (list, a, b) => list.filter(p => p.date >= a && p.date < b);

function classify(p, med) {
  if (p.reach >= med * VIRAL_X) return 'viral';
  if (p.reach >= med * STRONG_X) return 'strong';
  return 'normal';
}
const CLASS_LABEL = { viral: 'вирусный', strong: 'сильный', normal: 'обычный' };

/* =====================  ОТРИСОВКА  ===================== */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function delta(cur, prev, rng, isPct) {
  if (!rng.prevFrom) return `<div class="delta flat">за весь период</div>`;
  if (prev === null || prev === undefined) return `<div class="delta flat">нет данных за ${rng.label}</div>`;
  const diff = cur - prev;
  let txt;
  if (isPct) txt = (diff >= 0 ? '+' : '−') + Math.abs(diff).toFixed(1).replace('.', ',') + ' п.п.';
  else if (prev === 0) txt = (diff >= 0 ? '+' : '−') + fmtN(Math.abs(diff));
  else txt = Math.abs(diff / prev * 100).toFixed(0) + '%';
  if (Math.abs(diff) < 1e-9) return `<div class="delta flat">без изменений <span>к ${rng.label}</span></div>`;
  return diff > 0
    ? `<div class="delta up">↑ ${txt} <span>к ${rng.label}</span></div>`
    : `<div class="delta down">↓ ${txt} <span>к ${rng.label}</span></div>`;
}

function render() {
  const app = $('#app');
  const all = state.content.filter(p => p.net === state.net);
  const netTitle = state.net === 'instagram' ? 'Instagram' : 'YouTube';

  $('#updated').textContent = updatedText();

  if (!all.length) {
    $('#range').textContent = netTitle + ': данных пока нет';
    app.innerHTML = `<div class="card empty"><b>По ${netTitle} в таблице пока нет данных</b>
      Как только в листе «Контент» появятся строки с соцсетью «${netTitle}» (или заполнится блок ${netTitle.toUpperCase()}
      в «Еженедельной статистике»), нажмите «Обновить» — дашборд подхватит цифры.</div>`;
    return;
  }

  const rng = periodRange(all);
  const cur = inRange(all, rng.from, rng.to);
  const prev = rng.prevFrom ? inRange(all, rng.prevFrom, rng.prevTo) : null;
  $('#range').textContent = `${netTitle}: ${dmy(cur.length ? rng.from : all[0].date)} — ${dmy(addDays(rng.to, -1))} · ${cur.length} публ.`;

  const med = median(all.map(p => p.reach));
  const wk = (state.weekly[state.net] || {});
  const lastSubs = (wk.subs || []).filter(v => v !== null).pop();

  // --- KPI
  const sNow = sum(cur, 'subs'), sPrev = prev ? sum(prev, 'subs') : null;
  const eNow = erOf(cur), ePrev = prev && prev.length ? erOf(prev) : (prev ? null : null);
  const vNow = sum(cur, 'views'), vPrev = prev ? sum(prev, 'views') : null;

  let html = `<div class="grid">
    <div class="card c2 kpi">
      <div class="label">Подписчики${lastSubs ? ' · всего ' + fmtN(lastSubs) : ''}</div>
      <div class="value">+${fmtN(sNow)}</div>
      ${delta(sNow, sPrev, rng)}
    </div>
    <div class="card c2 kpi">
      <div class="label">Вовлеченность (ER)</div>
      <div class="value">${eNow.toFixed(1).replace('.', ',')}<small>%</small></div>
      ${delta(eNow, ePrev, rng, true)}
    </div>
    <div class="card c2 kpi">
      <div class="label">Просмотры</div>
      <div class="value">${fmtK(vNow)}</div>
      ${delta(vNow, vPrev, rng)}
    </div>`;

  // --- Рост подписчиков по неделям
  html += `<div class="card c6">
      <h2>Рост подписчиков по неделям</h2>
      <p class="hint" id="growthHint"></p>
      <div class="chart-wrap" id="growth"></div>
    </div>`;

  // --- Микс контента
  const fmts = {};
  cur.forEach(p => { (fmts[p.fmt] = fmts[p.fmt] || []).push(p); });
  const fmtKeys = Object.keys(fmts).sort((a, b) => fmts[b].length - fmts[a].length);
  const colorOf = k => k === 'Рилс' ? 'var(--plum)' : k === 'Посты' ? 'var(--gold)' : 'var(--red)';

  html += `<div class="card c3">
      <h2>Микс контента</h2>
      <p class="hint">Доля форматов среди публикаций за период</p>
      ${cur.length ? `<div class="donut-row">${donut(fmtKeys.map(k => ({ v: fmts[k].length, c: colorOf(k) })), cur.length)}
        <div class="donut-list">${fmtKeys.map(k => `<div class="row"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${colorOf(k)};margin-right:8px"></i>${k}</span>
          <span><span class="num">${Math.round(fmts[k].length / cur.length * 100)}%</span><span class="cnt">${fmts[k].length} шт.</span></span></div>`).join('')}</div></div>`
      : `<p class="hint">За выбранный период публикаций нет.</p>`}
    </div>`;

  // --- Сравнение форматов
  const avg = fmtKeys.map(k => ({ k, v: sum(fmts[k], 'reach') / fmts[k].length, m: median(fmts[k].map(p => p.reach)), n: fmts[k].length }));
  const maxAvg = Math.max(1, ...avg.map(a => a.v));
  html += `<div class="card c3">
      <h2>Сравнение форматов</h2>
      <p class="hint">Средний охват на одну публикацию</p>
      <div class="bars">${avg.map(a => `<div class="bar">
        <div class="top"><span>${a.k}</span><b>${fmtN(a.v)}</b></div>
        <div class="track"><div class="fill" style="width:${Math.max(2, a.v / maxAvg * 100)}%;background:${colorOf(a.k)}"></div></div>
        <div class="meta">${a.n} публ. · медиана ${fmtN(a.m)}</div></div>`).join('') || '<p class="hint">Нет данных за период.</p>'}</div>
    </div>`;

  // --- Воронка
  const F = [
    { t: 'Охват', v: sum(cur, 'reach'), c: 'var(--plum)' },
    { t: 'Просмотры', v: sum(cur, 'views'), c: '#b86f8c' },
    { t: 'Вовлеченность', v: sum(cur, eng), c: 'var(--gold)' },
    { t: 'Подписки', v: sum(cur, 'subs'), c: 'var(--red)' },
  ];
  const widths = [100, 88, 74, 60];
  html += `<div class="card c6">
      <h2>Воронка: личный бренд</h2>
      <p class="hint">Охват → просмотры → вовлеченность → подписки. Под стрелкой — какая доля дошла до следующего шага</p>
      <div class="funnel">${F.map((s, i) => {
        const step = `<div class="fstep"><div class="blk" style="background:${s.c};width:${widths[i]}%"><div class="n">${fmtK(s.v)}</div><div class="t">${s.t}</div></div></div>`;
        if (i === F.length - 1) return step;
        const conv = s.v ? F[i + 1].v / s.v * 100 : 0;
        return step + `<div class="farrow"><span class="ar">→</span><span class="pct">${fmtP(conv, conv < 10 ? 1 : 0)}</span><span>дошли</span></div>`;
      }).join('')}</div>
      <div class="fnote">Вовлеченность — лайки + комментарии + сохранения. Просмотры могут быть больше охвата: один человек смотрит публикацию несколько раз.
      От охвата до подписки в итоге доходит <b>${fmtP(F[0].v ? F[3].v / F[0].v * 100 : 0, 2)}</b>.</div>
    </div>`;

  // --- Топ публикаций
  const top = [...cur].sort((a, b) => b.reach - a.reach).slice(0, 3);
  html += `<div class="card c6">
      <h2>Топ публикаций</h2>
      <p class="hint">Три лучшие по охвату за период. Метка — сравнение с медианным охватом (${fmtN(med)}): вирусный ≥ ×${VIRAL_X}, сильный ≥ ×${STRONG_X}</p>
      ${top.length ? `<div class="tops">${top.map(p => { const c = classify(p, med); return `<div class="post">
        <div class="head"><span>${dmy(p.date)} · ${p.fmt}</span><span class="badge ${c}">${CLASS_LABEL[c]}</span></div>
        <div class="ttl">${esc(p.topic)}</div>
        <div class="big">${fmtN(p.reach)}<span>охват</span></div>
        <div class="stats"><span>ER <b>${fmtP(erOf([p]))}</b></span><span>подписки <b>+${fmtN(p.subs)}</b></span><span>×${(p.reach / med).toFixed(1).replace('.', ',')}</span></div>
      </div>`; }).join('')}</div>` : '<p class="hint">За выбранный период публикаций нет.</p>'}
    </div>`;

  // --- Планирование
  html += `<div class="card c6" id="planCard"></div></div>`;
  app.innerHTML = html;

  drawGrowth(all, rng, wk);
  renderPlan(all, med);
}

function donut(parts, total) {
  const R = 46, C = 2 * Math.PI * R;
  let off = 0;
  const segs = parts.map(p => {
    const len = p.v / total * C;
    const s = `<circle r="${R}" cx="60" cy="60" fill="none" stroke="${p.c}" stroke-width="16"
      stroke-dasharray="${Math.max(0, len - 2)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;
    off += len; return s;
  }).join('');
  return `<svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Микс контента">
    <circle r="${R}" cx="60" cy="60" fill="none" stroke="#f4efea" stroke-width="16"/>${segs}
    <text x="60" y="60" text-anchor="middle" font-size="20" font-weight="700" fill="var(--text)">${total}</text>
    <text x="60" y="76" text-anchor="middle" font-size="10" fill="var(--muted)">публикаций</text></svg>`;
}

function drawGrowth(all, rng, wk) {
  const box = $('#growth');
  let pts, hint;
  const ws = (wk.subs || []).map((v, i) => ({ v, i })).filter(x => x.v !== null);
  if (ws.length >= 2) {
    pts = ws.map(x => ({ label: 'Нед. ' + (x.i + 1), v: x.v, hi: true }));
    hint = 'Всего подписчиков по данным листа «Еженедельная статистика»';
  } else {
    const w0 = startOfWeek(all[0].date), w1 = startOfWeek(all[all.length - 1].date);
    pts = []; let acc = 0;
    for (let w = w0; w <= w1; w = addDays(w, 7)) {
      const g = sum(all.filter(p => startOfWeek(p.date).getTime() === w.getTime()), 'subs');
      acc += g;
      pts.push({ label: dm(w), v: acc, gain: g, hi: addDays(w, 7) > rng.from && w < rng.to });
    }
    hint = 'Накопленный прирост подписчиков с публикаций (неделя начинается с понедельника). Выделены недели выбранного периода';
  }
  $('#growthHint').textContent = hint;

  const W = Math.max(320, box.clientWidth || 900), H = 190, pl = 48, pr = 16, pt = 18, pb = 30;
  const max = Math.max(...pts.map(p => p.v)) * 1.12 || 1;
  const min = ws.length >= 2 ? Math.min(...pts.map(p => p.v)) * 0.98 : 0;
  const x = i => pl + (pts.length === 1 ? (W - pl - pr) / 2 : i * (W - pl - pr) / (pts.length - 1));
  const y = v => pt + (1 - (v - min) / (max - min || 1)) * (H - pt - pb);
  const P = pts.map((p, i) => [x(i), y(p.v)]);

  // сглаженная линия (монотонный кубический сплайн — без «выбросов» ниже нуля)
  const n = P.length, d = [], m = [];
  for (let i = 0; i < n - 1; i++) d.push((P[i + 1][1] - P[i][1]) / (P[i + 1][0] - P[i][0]));
  for (let i = 0; i < n; i++) {
    if (i === 0) m.push(d[0] || 0); else if (i === n - 1) m.push(d[n - 2] || 0);
    else m.push(d[i - 1] * d[i] <= 0 ? 0 : 2 / (1 / d[i - 1] + 1 / d[i]));
  }
  let path = `M${P[0][0]},${P[0][1]}`;
  for (let i = 0; i < n - 1; i++) {
    const h = (P[i + 1][0] - P[i][0]) / 3;
    path += ` C${P[i][0] + h},${P[i][1] + m[i] * h} ${P[i + 1][0] - h},${P[i + 1][1] - m[i + 1] * h} ${P[i + 1][0]},${P[i + 1][1]}`;
  }
  const area = path + ` L${P[n - 1][0]},${H - pb} L${P[0][0]},${H - pb} Z`;

  const ticks = 4; let grid = '';
  for (let t = 0; t <= ticks; t++) {
    const v = min + (max - min) * t / ticks, yy = y(v);
    grid += `<line x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}" stroke="#efe8e2"/>
      <text x="${pl - 8}" y="${yy + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtK(v)}</text>`;
  }
  const every = Math.ceil(pts.length / (W < 560 ? 5 : 10));
  const lastTick = Math.floor((pts.length - 1) / every) * every;
  const showX = i => i % every === 0 ? !(i === lastTick && i !== pts.length - 1 && x(pts.length - 1) - x(i) < 44) : (i === pts.length - 1 && x(i) - x(lastTick) >= 44);
  const xl = pts.map((p, i) => showX(i) ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${p.label}</text>` : '').join('');
  const hiIdx = pts.map((p, i) => p.hi ? i : -1).filter(i => i >= 0);
  const band = hiIdx.length && hiIdx.length < pts.length
    ? `<rect x="${x(hiIdx[0]) - 10}" y="${pt}" width="${x(hiIdx[hiIdx.length - 1]) - x(hiIdx[0]) + 20}" height="${H - pt - pb}" fill="var(--gold-soft)" rx="8"/>` : '';
  const dots = P.map((q, i) => `<circle cx="${q[0]}" cy="${q[1]}" r="${i === n - 1 ? 5 : 3.5}" fill="#fff" stroke="var(--plum)" stroke-width="2">
    <title>${pts[i].label}: ${fmtN(pts[i].v)}${pts[i].gain !== undefined ? ' (+' + fmtN(pts[i].gain) + ' за неделю)' : ''}</title></circle>`).join('');
  const last = P[n - 1];

  box.innerHTML = `<svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="display:block;height:${H}px">
    <defs><linearGradient id="gFill" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#a25574" stop-opacity=".28"/><stop offset="1" stop-color="#a25574" stop-opacity="0"/></linearGradient></defs>
    ${band}${grid}
    <path d="${area}" fill="url(#gFill)"/>
    <path d="${path}" fill="none" stroke="var(--plum)" stroke-width="2.5" stroke-linecap="round"/>
    ${dots}${xl}
    <text x="${Math.min(last[0], W - pr - 4)}" y="${last[1] - 12}" text-anchor="end" font-size="13" font-weight="700" fill="var(--plum)">${fmtN(pts[n - 1].v)}</text>
  </svg>`;
}

function renderPlan(all, med) {
  const card = $('#planCard');
  const goal = +($('#goalInput') && $('#goalInput').value) || state.goal || GOAL_SUBS;
  const months = +($('#monthsInput') && $('#monthsInput').value) || state.months || GOAL_MONTHS;
  state.goal = goal; state.months = months;

  const spanMonths = Math.max(1, (all[all.length - 1].date - all[0].date) / DAY + 1) / 30.44;
  const strong = all.filter(p => classify(p, med) !== 'normal');
  const onlyStrong = all.filter(p => classify(p, med) === 'strong');
  const normal = all.filter(p => classify(p, med) === 'normal');

  const needPerMonth = goal / months;
  const pacePerMonth = sum(all, 'subs') / spanMonths;
  const basePerMonth = sum(normal, 'subs') / spanMonths;      // «фон» от обычных публикаций
  const avgStrong = strong.length ? sum(strong, 'subs') / strong.length : 0;
  const avgOnlyStrong = onlyStrong.length ? sum(onlyStrong, 'subs') / onlyStrong.length : 0;
  const strongPerMonthNow = strong.length / spanMonths;
  const need = avgStrong ? Math.ceil(Math.max(0, needPerMonth - basePerMonth) / avgStrong) : null;
  const needNoViral = avgOnlyStrong ? Math.ceil(Math.max(0, needPerMonth - basePerMonth) / avgOnlyStrong) : null;
  const pctPace = Math.min(100, pacePerMonth / needPerMonth * 100);
  const g = state.goals.subs;

  card.innerHTML = `<h2>Планирование</h2>
    <p class="hint">Цель: +${fmtN(goal)} подписчиков за ${months} мес.${g && (g.min || g.max) ? ` · в листе «Цели»: план ${g.min ? 'мин ' + fmtN(g.min) : ''}${g.max ? ' / макс ' + fmtN(g.max) : ''}` : ''}</p>
    <div class="plan">
      <div class="answer">
        <div class="n">${need === null ? '—' : need}</div>
        <div class="t">сильных публикаций в месяц нужно, чтобы выйти на цель</div>
        <div class="alt">Сильная публикация — охват от ×${STRONG_X} медианы (от ${fmtN(med * STRONG_X)}). Сейчас таких в среднем
          <b>${strongPerMonthNow.toFixed(1).replace('.', ',')}</b> в месяц.
          ${needNoViral !== null ? `Если считать без вирусных (только «сильные»), понадобится <b>${needNoViral}</b> в месяц — основной прирост дают именно вирусные посты.` : ''}</div>
        <div class="progress"><div style="width:${pctPace}%"></div></div>
        <div class="alt" style="margin-top:0">Текущий темп закрывает <b>${fmtP(pctPace, 0)}</b> нужного ежемесячного прироста.</div>
        <div class="inputs">
          <label>Цель, подписчиков<input id="goalInput" type="number" min="1" step="100" value="${goal}"></label>
          <label>Срок, месяцев<input id="monthsInput" type="number" min="1" step="1" value="${months}"></label>
        </div>
      </div>
      <table>
        <tr><td>Нужно в месяц</td><td>+${fmtN(needPerMonth)}</td></tr>
        <tr><td>Текущий темп в месяц</td><td>+${fmtN(pacePerMonth)}</td></tr>
        <tr><td>Из них от обычных публикаций</td><td>+${fmtN(basePerMonth)}</td></tr>
        <tr><td>В среднем подписок с 1 сильной / вирусной</td><td>+${fmtN(avgStrong)}</td></tr>
        <tr><td>Сильных и вирусных за всё время</td><td>${strong.length} из ${all.length}</td></tr>
        <tr><td>Расчет</td><td style="font-weight:400;color:var(--muted)">(${fmtN(needPerMonth)} − ${fmtN(basePerMonth)}) / ${fmtN(avgStrong)}</td></tr>
      </table>
    </div>`;

  ['#goalInput', '#monthsInput'].forEach(s => $(s).addEventListener('change', () => renderPlan(all, med)));
}

function updatedText() {
  const now = new Date();
  const same = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  if (state.updatedAt) return 'обновлено сегодня в ' + state.updatedAt.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  const snap = parseDate(SNAPSHOT_DATE);
  return same(snap, now) ? 'обновлено сегодня' : 'обновлено ' + dmy(snap);
}

/* =====================  ОБНОВЛЕНИЕ ИЗ ТАБЛИЦЫ  ===================== */

async function fetchText(url, ms = 9000) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctl.signal, cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const txt = await r.text();
    if (/^\s*</.test(txt)) throw new Error('html'); // страница входа вместо CSV
    return txt;
  } finally { clearTimeout(t); }
}

async function refresh() {
  const btn = $('#refresh');
  btn.classList.add('busy');
  const got = {};
  const take = rows => { const k = detectSheet(rows); if (k && !got[k]) got[k] = rows; };

  // 1) опубликованные CSV-ссылки
  await Promise.all(PUBLISHED_CSV_URLS.map(u => fetchText(u).then(t => take(parseCSV(t))).catch(() => {})));

  // 2) прямое чтение листов (работает, если у таблицы открыт доступ по ссылке)
  await Promise.all(Object.entries(SHEET_NAMES).filter(([k]) => !got[k]).map(([k, name]) =>
    fetchText(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}`)
      .then(t => { const rows = parseCSV(t); if (!got[k]) got[k] = rows; }).catch(() => {})));

  let changed = false;
  if (got.content) { const c = normalizeContent(got.content); if (c.length) { state.content = c; changed = true; } }
  if (got.weekly) { state.weekly = normalizeWeekly(got.weekly); changed = true; }
  if (got.goals) { state.goals = normalizeGoals(got.goals); changed = true; }
  if (changed) state.updatedAt = new Date();
  // если ничего не удалось прочитать — молча остаемся на вшитых цифрах

  btn.classList.remove('busy');
  render();
}

/* =====================  СОБЫТИЯ  ===================== */

function bindSeg(id, key) {
  $(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    $(id).querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    state[key] = b.dataset.v; render();
  });
}
bindSeg('#netSeg', 'net');
bindSeg('#perSeg', 'period');
$('#refresh').addEventListener('click', refresh);
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 150); });
render();
</script>
